<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

 "fontWeight": "800" }] } } } };</script></head><body class="bg-background font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<!-- Tarjeta Top Status / Insignias -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-md mt-space-md" style="border: 2px solid #18181B; box-shadow: 3px 3px 0px 0px #18181B;">
<div class="flex items-center justify-between gap-space-sm flex-wrap">
<div class="inline-flex items-center gap-1.5 px-3 py-1 bg-primary-container rounded-full" style="border: 1.5px solid #18181B;">
<span class="material-symbols-outlined text-[16px] text-on-surface">lock</span>
<span class="font-label-sm text-label-sm text-on-surface tracking-wider uppercase">com.instagram.android</span>
</div>
<div class="inline-flex items-center gap-1 px-3 py-1 bg-error-container rounded-full" style="border: 1.5px solid #18181B;">
<span class="material-symbols-outlined text-[15px] text-on-error-container">warning</span>
<span class="font-label-sm text-label-sm text-on-error-container font-extrabold uppercase">INTENTO 07 DE HOY</span>
</div>
</div>
<!-- Avatar y Nivel de Decepción -->
<div class="flex flex-col items-center justify-center pt-space-lg pb-space-sm text-center">
<div class="relative w-24 h-24 mb-space-sm flex items-center justify-center bg-tertiary-container rounded-full" style="border: 2px solid #18181B; box-shadow: 2px 2px 0px 0px #18181B;">
<img alt="Banano Minimalista Cartoon Decepcionado" class="w-20 h-20 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1URkappI9yH28SAi9SmJOZXqJwKkEHgzlSHkfWeBPupKhfChBQ5gMihX8KUtBXZGh-yE8sl8ZBXudI_MwiCwCG1eP0JN1ClEefAWjkZy8uYXYeKhsXvWddTMHBl8LpW4LYdwpiSYna0QZK2kgOGVPuUd_vpH_mMEqGj8DqQrqsjxb2uzsrXNG5eDNB0-3MPt6m-hkJb-IC2TDGiil1PzMOl6ilu_YzXH1xcRVzTq__czLG2ZvYPgMMFVRU"/>
<div class="absolute -top-1 -right-1 bg-secondary-container px-2 py-0.5 rounded-full" style="border: 1.5px solid #18181B;">
<span class="font-label-sm text-label-sm text-on-secondary-container font-black">!</span>
</div>
</div>
<div class="inline-block px-3 py-1 bg-surface-container-high rounded-full mt-space-xs" style="border: 1.5px solid #18181B;">
<p class="font-label-sm text-label-sm text-on-surface font-extrabold tracking-wide uppercase">
          NIVEL DE DECEPCIÓN: MÁXIMO
        </p>
</div>
</div>
</div>
<!-- Mensaje Central Sarcástico -->
<div class="w-full my-space-lg text-center px-space-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-snug">
      ¿Instagram otra vez, Carlos? Así piensas ser el mejor programador del mundo. Qué mierda.
    </h1>
</div>
<!-- Tarjeta de Regla Activa y Estadísticas -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-md mb-space-lg" style="border: 2px solid #18181B; box-shadow: 3px 3px 0px 0px #18181B;">
<div class="flex items-center gap-space-sm mb-space-xs">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center shrink-0" style="border: 1.5px solid #18181B;">
<span class="material-symbols-outlined text-[18px] text-on-secondary-container">bedtime</span>
</div>
<div class="min-w-0">
<p class="font-label-md text-label-md text-on-surface uppercase tracking-wide">
          Regla activa: Bloqueo nocturno (22:00 - 06:00)
        </p>
</div>
</div>
<div class="mt-space-sm pt-space-sm flex items-center justify-between bg-surface-container-low px-3 py-2 rounded-xl" style="border: 1.5px solid #18181B;">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] text-tertiary">timer</span>
<span class="font-body-sm text-body-sm text-on-surface font-bold">42 minutos perdidos hoy</span>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] text-outline">commit</span>
<span class="font-body-sm text-body-sm text-on-surface-variant font-bold">0 commits enviados</span>
</div>
</div>
</div>
<!-- Botones de Acción Táctiles -->
<div class="w-full flex flex-col gap-space-md">
<!-- Botón Salir (Primary) -->
<button class="w-full h-[54px] bg-primary-container rounded-full flex items-center justify-center gap-space-sm transition-all duration-75 active:translate-x-[2px] active:translate-y-[2px]" onclick="window.history.back()" style="border: 2px solid #18181B; box-shadow: 3px 3px 0px 0px #18181B;" type="button">
<span class="material-symbols-outlined text-on-surface text-[24px]">home</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-extrabold tracking-wide uppercase">Salir al Inicio</span>
</button>
<!-- Botón Emergencia -->
<button class="w-full h-[50px] bg-surface-container-lowest rounded-full flex items-center justify-between px-space-md transition-all duration-75 active:translate-x-[2px] active:translate-y-[2px]" style="border: 2px solid #18181B; box-shadow: 3px 3px 0px 0px #18181B;" type="button">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] text-error">emergency</span>
<span class="font-label-lg text-label-lg text-on-surface font-bold">Esto es una emergencia</span>
</div>
<span class="px-2.5 py-0.5 rounded-full bg-error-container text-on-error-container font-label-sm text-label-sm font-extrabold uppercase" style="border: 1px solid #18181B;">
        1/2 disponibles
      </span>
</button>
<!-- Botón 10 minutos más -->
<button class="w-full h-[50px] bg-surface-container-lowest rounded-full flex items-center justify-between px-space-md transition-all duration-75 active:translate-x-[2px] active:translate-y-[2px]" style="border: 2px solid #18181B; box-shadow: 3px 3px 0px 0px #18181B;" type="button">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] text-secondary">snooze</span>
<span class="font-label-lg text-label-lg text-on-surface font-bold">Dame 10 minutos más</span>
</div>
<span class="px-2.5 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-sm text-label-sm font-extrabold uppercase" style="border: 1px solid #18181B;">
        2/3 disponibles
      </span>
</button>
</div>
</div></main></body></html>
