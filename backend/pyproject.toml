[project]
name = "lavidanoesunbanano-api"
version = "0.1.0"
description = "Backend de La vida no es un banano: plantillas sarcásticas y juez de excusas con Grok."
requires-python = ">=3.12,<3.13"
dependencies = [
    "emoji>=2.16.0,<3",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.10,<2",
    "langchain-xai>=1.3.0,<2",
    "langgraph>=1.2.15,<2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.38",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
# Es una app, no una librería: uv instala solo las dependencias.
package = false

[tool.vercel]
entrypoint = "banano.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
