<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="t d">
  <title id="t">La vida no es un banano</title>
  <desc id="d">Agente de IA para Android que interrumpe el uso compulsivo del celular con mensajes personalizados.</desc>
  <style>
    .title { font: 800 44px 'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1E1E24; }
    .sub { font: 500 18px 'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4D4632; }
    .mono { font: 700 13px 'Geist Mono', ui-monospace, Consolas, 'Courier New', monospace; fill: #1E1E24; letter-spacing: 1px; }
  </style>
  <!-- Tarjeta Warm Toon: sombra dura desplazada, sin difuminar -->
  <rect x="14" y="14" width="934" height="214" rx="24" fill="#1E1E24"/>
  <rect x="6" y="6" width="934" height="214" rx="24" fill="#FFFDF7" stroke="#1E1E24" stroke-width="2"/>

  <!-- Banano de una sola línea -->
  <g transform="translate(78 48)" fill="none" stroke="#1E1E24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8 C 10 52, 30 108, 98 128 C 116 133, 128 128, 124 120 C 76 104, 50 66, 38 12 Z" fill="#FACC15"/>
    <path d="M18 8 L 14 0 L 30 -2 L 38 12"/>
    <path d="M124 120 L 132 126"/>
    <!-- Cara decepcionada -->
    <path d="M52 70 l6 2" />
    <path d="M70 84 l6 1" />
    <path d="M58 98 q 8 -6 16 2" />
  </g>

  <text x="250" y="96" class="title">La vida no es un banano</text>
  <text x="250" y="132" class="sub">Un agente de IA que aparece justo cuando vas a romper tu propio</text>
  <text x="250" y="156" class="sub">compromiso con el celular, dice lo que tiene que decir y se quita.</text>

  <!-- Píldora: participación en el reto -->
  <rect x="250" y="176" width="226" height="30" rx="15" fill="#FACC15" stroke="#1E1E24" stroke-width="2"/>
  <text x="363" y="196" class="mono" text-anchor="middle">RETO AGENTE 2026</text>
  <rect x="488" y="176" width="226" height="30" rx="15" fill="#FFFFFF" stroke="#1E1E24" stroke-width="2"/>
  <text x="601" y="196" class="mono" text-anchor="middle">ANDROID · LANGGRAPH</text>
</svg>
